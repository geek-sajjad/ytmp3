version: 2

before:
  hooks:
    # ffmpeg, yt-dlp and deno are embedded into each binary (see bundle.go).
    - sh scripts/fetch-deps.sh

builds:
  - binary: ytmp3
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    tags:
      - bundled
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "ytmp3_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
